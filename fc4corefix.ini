; FC4CoreFix settings - place next to dinput8.dll in Far Cry 4\bin
[FC4CoreFix]

; ---- Faster startup ----
; 1 = skip the intro / logo videos (adds the game's own -skipintro option)
SkipIntro=1

; ---- Presentation fix (the main FPS fix) ----
; 1 = convert the game's legacy "copy + compose" swap chain to the modern flip model.
;     OFF: the game re-creates its swap chain on the same window when loading into
;     the world, which flip model does not allow -> crash in borderless mode.
ForceFlipModel=0
; 1 = allow tearing when VSync is off in-game (lowest latency, no FPS cap)
AllowTearing=1
; back buffers for the flip swap chain (2-4). 3 = smooth, 2 = lowest latency
FlipBuffers=3

; ---- CPU scheduling ----
; How many CPUs the engine sees when it sizes its job-worker pool. The engine
; makes one worker per CPU and the main thread wakes each one per job batch
; (~27% of main-thread time with 12). 6 = one per physical core. 0 = off.
JobThreadCPUs=6
; 1 = give the 2 heaviest game threads (main/render) physical cores 1 and 2 to
;     themselves; all other game threads are kept off those cores
DedicatedCores=1
; 1 = stop the engine from hard-pinning its 12 job threads to fixed CPUs
UnpinThreads=1
; 1 = ignore the game's attempts to restrict its own process affinity
BlockProcessAffinity=1
; 1 = request 1 ms timer resolution (smoother frame pacing)
TimerResolution=1
; 1 = opt out of Windows power throttling (EcoQoS) - helps on laptops
DisablePowerThrottling=1
; 0 = leave, 1 = Above Normal, 2 = High
PriorityClass=0
; 1 = additionally keep the game off CPU0 and its SMT sibling (CPU1)
AvoidCPU0=0

; 1 = sample where the main/render threads wait and write it to the log
;     (small overhead; turn off once the bottleneck is identified)
Profiler=0

; 1 = write a short fc4corefix.log in the bin folder (startup info only)
Log=1
